name: SAMPLE MacOS Tests
on:
  workflow_call:

jobs:
  macos:
    name: clang (${{ matrix.options }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        options: [Debug, Release]

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Configure CMake and Build
        uses: jfalcou/copacabana/.github/actions/config@643b9f4cac5bbfa7a6cfe6da385478c5aa3773f8 # v6
        with:
          config: ${{ matrix.options }}
          preset: clang-macos

      - name: Run Unit Tests
        uses: jfalcou/copacabana/.github/actions/test@643b9f4cac5bbfa7a6cfe6da385478c5aa3773f8 # v6
        with:
          config: ${{ matrix.options }}
          preset: clang-macos
