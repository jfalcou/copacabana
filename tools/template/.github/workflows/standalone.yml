## Republishes the single header on the standalone branch, which has to exist before the first run.
name: SAMPLE Standalone
on:
  push:
    branches:
      - main

jobs:
  standalone:
    permissions:
      contents: write
      pull-requests: write
    uses: jfalcou/copacabana/.github/workflows/package-standalone.yml@main
    with:
      project: sample
