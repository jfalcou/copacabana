name: SAMPLE Integration Tests
on:
  push:
    branches:
      - main

concurrency:
  group: sample-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    uses: jfalcou/copacabana/.github/workflows/integration.yml@05d0796125e284daa16d9a4f6424c58f98a2bb5a # v7
    with:
      project: sample
      cxx-compiler: clang++
      cxx-flags: -std=c++20
