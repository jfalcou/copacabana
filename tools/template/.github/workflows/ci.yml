name: Unit Tests
on:
  pull_request:
    branches:
      - main
  ## Main gets the matrix once a night rather than on every merge: a run of its own queued behind each merge held
  ## the pull requests back. Give each project its own rung of the fleet's 45 minute ladder, which starts at 00:35 UTC
  ## and never lands on the hour every other scheduled workflow on the platform asks for.
  schedule:
    - cron: '50 5 * * *'
  ## Runs main on demand, since a re-run keeps the shared workflows its first attempt resolved.
  workflow_dispatch:

concurrency:
  group: sample-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##################################################################################################
  ## Fast gate: the checks below start together with no interdependency, and only once they all pass does the
  ## much heavier compiler matrix start.
  ##################################################################################################
  ## Named so that the check reads "Meta Checks / Pre-commit", the context the ruleset requires.
  precommit:
    name: Meta Checks
    uses: jfalcou/copacabana/.github/workflows/precommit.yml@main

##@if standalone@
  ##======================================================================================================================
  ## Ensure Standalone is viable
  ##======================================================================================================================
  standalone-generation:
    name: Standalone Generation
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v11
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Generate standalone header
        run: |
          cmake -S . -B build -G Ninja -DSAMPLE_BUILD_TEST=OFF -DSAMPLE_BUILD_DOCUMENTATION=OFF
          cmake --build build --target sample-standalone

      - name: Test standalone header
        run: |
          cd build
          g++ -std=c++20 -S -I. ../test/integration/main.cpp -DSAMPLE_STANDALONE
##@endif@

  ##################################################################################################
  ## Sanitizers (ASan+UBSan)
  ##################################################################################################
  sanitizer-tests:
    name: Sanitizers
    uses: jfalcou/copacabana/.github/workflows/sanitizers.yml@main
    with:
      image: ghcr.io/jfalcou/compilers:v11

  ##################################################################################################
  ## Coverage report - informational, runs alongside the gate without blocking the matrix
  ##################################################################################################
  coverage-report:
    name: Coverage
    uses: jfalcou/copacabana/.github/workflows/coverage.yml@main
    with:
      project: sample
      image: ghcr.io/jfalcou/compilers:v11

  ##################################################################################################
  ## Unit Tests - the full compiler matrix, gated behind the fast checks above all passing
  ##################################################################################################
  linux-tests:
    name: Linux
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@main
    with:
      file: .github/matrices/linux.yml

  macos-tests:
    name: MacOS
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@main
    with:
      file: .github/matrices/macos.yml

  windows-tests:
    name: Windows
    needs: [precommit, standalone-generation, sanitizer-tests]
    uses: jfalcou/copacabana/.github/workflows/matrix.yml@main
    with:
      file: .github/matrices/windows.yml
