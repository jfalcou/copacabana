# CPM is vendored upstream code, in every copy, and our style has no business rewriting it. The template also carries
# a .pre-commit-config.yaml of its own, which is the generated project's, not this one's.
exclude: |
    (?x)^(
        test/example/cmake/CPM\.cmake|
        tools/template/cmake/CPM\.cmake|
        tools/template/test/integration/cpm-test/cpm\.cmake
    )$

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://github.com/cheshirekow/cmake-format-precommit
  rev: v0.6.13
  hooks:
  - id: cmake-format
  - id: cmake-lint
