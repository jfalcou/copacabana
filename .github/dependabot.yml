## Keeps the action references in .github/workflows current. Everything lands in one grouped pull
## request a week rather than one per action, and a SHA pin is rewritten along with the version
## comment that documents it - which is what makes pinning by commit sustainable by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  ## The copacabana pins here stay ignored: a scaffolded project names a published tag, not the tip of main.
  - package-ecosystem: "github-actions"
    directory: "/tools/template"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "jfalcou/copacabana/*"
    groups:
      template-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
