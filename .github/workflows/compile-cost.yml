##======================================================================================================================
## What every translation unit costs to compile, measured on a pull request and on main so that the two can be
## subtracted. Shared by every project using copa_setup_compile_cost.
##
##   jobs:
##     compile-cost:
##       uses: jfalcou/copacabana/.github/workflows/compile-cost.yml@<sha> # v7
##       permissions:
##         actions: read
##         contents: read
##       with:
##         project: mylib
##
## A push to main leaves a reference artifact, <project>-compile-cost-reference, kept 90 days. A pull request looks up
## the last successful run of the calling workflow on main, downloads that artifact and reports the delta against it; until the first merge there is
## none, and the report says so. Reading an artifact off another run is outside the contents scope the token defaults
## to, hence the permissions above: a called workflow gets no more than its caller grants.
##
## The measurement runs in the pinned image on a hosted runner. Two runs weeks apart stay comparable only under the
## same compiler, and a peak recorded beside other builds on a shared machine belongs to them as much as to the code.
## Whether the figures mean anything is decided by the preset: it has to configure the build the way the rest of the
## CI does, same toolchain, same ISA, same defines, with the measurement turned on.
##======================================================================================================================
name: Compile Cost
on:
  workflow_call:
    inputs:
      project:
        description: 'Project name, lowercased - drives the report target'
        type: string
        required: true
      preset:
        description: 'Configure and build preset, the one that turns the measurement on'
        type: string
        default: 'clang-compile-cost'
      image:
        description: 'Container image to build in'
        type: string
        default: 'ghcr.io/jfalcou/compilers:v10'
      jobs:
        description: 'Parallel compilations. Two is what a 4 core, 15 GiB runner carries for units peaking above 3 GiB.'
        type: number
        default: 2

jobs:
  measure:
    name: Compile Cost
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    permissions:
      actions: read
      contents: read

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      ## Both steps are JavaScript actions, which the runner supplies its own node for, so they work inside a
      ## container that carries none. The run looked up is one of the calling workflow's, whose file is read off its
      ## reference: a called workflow knows no name of its own.
      - name: Find the reference run
        id: reference
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        with:
          result-encoding: string
          script: |
            const file = process.env.WORKFLOW_REF.split('@')[0].split('/').pop();
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: file,
              branch: 'main',
              status: 'success',
              per_page: 1
            });
            return runs.data.workflow_runs.length ? String(runs.data.workflow_runs[0].id) : '';

      - name: Fetch the reference measured on main
        if: steps.reference.outputs.result != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.project }}-compile-cost-reference
          path: reference
          run-id: ${{ steps.reference.outputs.result }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      ## The report target rebuilds the units from a clean tree, at the parallelism the environment names.
      - name: Configure, measure and report
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          PROJECT: ${{ inputs.project }}
          JOBS: ${{ inputs.jobs }}
        run: |
          baseline=()
          if [ -f "reference/${PROJECT}-compile-cost.csv" ]; then
            baseline=(-DCOPA_COMPILE_COST_BASELINE="$PWD/reference/${PROJECT}-compile-cost.csv")
          fi

          cmake --preset "$PRESET" "${baseline[@]}"
          CMAKE_BUILD_PARALLEL_LEVEL="$JOBS" cmake --build --preset "$PRESET" --target "${PROJECT}-compile-cost-report"

      - name: Report
        shell: bash
        env:
          PRESET: ${{ inputs.preset }}
          PROJECT: ${{ inputs.project }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ ! -f "reference/${PROJECT}-compile-cost.csv" ]; then
            echo "> No reference from main was found, so this run has no delta." >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "build/$PRESET/compile-cost/summary.md" >> "$GITHUB_STEP_SUMMARY"

      ## Main leaves the reference every pull request is read against, kept long enough to see a trend. A pull request
      ## leaves its own table, kept while the review lasts. Both files sit at the artifact's root, which is where the
      ## download above looks.
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.project }}-compile-cost${{ github.event_name == 'push' && '-reference' || '' }}
          path: |
            build/${{ inputs.preset }}/compile-cost/${{ inputs.project }}-compile-cost.md
            build/${{ inputs.preset }}/compile-cost/${{ inputs.project }}-compile-cost.csv
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
