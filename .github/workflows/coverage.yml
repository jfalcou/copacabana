##======================================================================================================================
## Coverage run and job summary, shared by every project using copa_setup_coverage.
##
##   jobs:
##     coverage:
##       uses: jfalcou/copacabana/.github/workflows/coverage.yml@<sha> # v8
##       with:
##         project: mylib
##         build-targets: mylib-test
##======================================================================================================================
name: Coverage
on:
  workflow_call:
    inputs:
      project:
        description: 'Project name, lowercased - drives the report target and the header path'
        type: string
        required: true
      image:
        description: 'Container image to build in'
        type: string
        default: 'ghcr.io/jfalcou/compilers:v10'
      build-targets:
        description: 'Space-separated build targets. Empty builds the preset default target.'
        type: string
        default: ''
      min-coverage:
        description: 'Line coverage under this percentage fails the job. 0 only asks that something was measured.'
        type: number
        default: 0

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}

    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Configure CMake and Build
        shell: bash
        env:
          TARGETS: ${{ inputs.build-targets }}
        run: |
          cmake --preset gcc-coverage

          args=(--build --preset gcc-coverage --config Debug)
          if [ -n "$TARGETS" ]; then
            # shellcheck disable=SC2206 # a space-separated list of targets, split on purpose
            args+=(--target $TARGETS)
          fi

          cmake "${args[@]}" --parallel 2

      - name: Run Unit Tests and Collect Coverage
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: cmake --build build/gcc-coverage --config Debug --target "${PROJECT}-coverage-report"

      - name: Report Coverage
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
          MIN_COVERAGE: ${{ inputs.min-coverage }}
        run: |
          python3 - "build/gcc-coverage/coverage/summary.json" "$PROJECT" "$MIN_COVERAGE" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys

          report = json.load(open(sys.argv[1]))
          project = sys.argv[2]
          floor = float(sys.argv[3])

          # gcovr reports no rate at all for a metric a header has no instance of - a branchless
          # header is not 0% covered, it simply has nothing to say on that metric.
          def rate(percent):
            return "n/a" if percent is None else f"{percent:.1f}%"

          def bar(percent):
            filled = 0 if percent is None else round(percent / 5)
            return "#" * filled + "." * (20 - filled)

          print(f"## Coverage of `include/{project}`\n")
          print("| Metric | Covered | Total | Rate | |")
          print("|---|---:|---:|---:|---|")
          for name, key in [("Lines", "line"), ("Functions", "function"), ("Branches", "branch")]:
            percent = report[f"{key}_percent"]
            print(f"| {name} | {report[f'{key}_covered']} | {report[f'{key}_total']} "
                  f"| {rate(percent)} | `{bar(percent)}` |")

          print("\n<details><summary>Per-header breakdown</summary>\n")
          print("| Header | Lines | Functions | Branches |")
          print("|---|---:|---:|---:|")

          # Worst first: the headers needing attention are the point of the table.
          for entry in sorted(report["files"], key=lambda f: (f["line_percent"] is None, f["line_percent"])):
            print(f"| `{entry['filename']}` | {rate(entry['line_percent'])} "
                  f"| {rate(entry['function_percent'])} | {rate(entry['branch_percent'])} |")

          print("\n</details>")

          # A report of nothing is the shape a broken run takes: gcovr writes its summary whether or not any line was
          # instrumented, and a table of zeroes reads like a clean one at a glance.
          measured = report["line_total"]
          percent = report["line_percent"]

          if not measured or percent is None:
            print(f"\n**No line was measured.** This run proves nothing about the coverage of `{project}`.")
            sys.exit(1)

          if percent < floor:
            print(f"\n**Line coverage is {percent:.1f}%, under the {floor:.1f}% this project asks for.**")
            sys.exit(1)
          EOF

      - name: Upload HTML Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/gcc-coverage/coverage/
