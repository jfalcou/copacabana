name: Copacabana - Windows Unit Tests
on:
  workflow_call:

jobs:

  windows:
    runs-on: [windows-2022]
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { compiler: "Visual Studio 17 2022", config: Debug   , mode: dev-normal }
        - { compiler: "Visual Studio 17 2022", config: Debug   , mode: dev-asan   }
        - { compiler: "Visual Studio 17 2022", config: Release , mode: dev-normal }
        - { compiler: "Visual Studio 17 2022", config: Release , mode: dev-asan   }
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7
      ## The generator finds the toolchain on its own, so nothing here needs the compiler environment. What does need
      ## it is running an ASan-instrumented binary: clang_rt.asan_dynamic-x86_64.dll ships beside cl.exe and is loaded
      ## at startup, so without its directory on PATH every test exits 0xc0000135, STATUS_DLL_NOT_FOUND.
      - name: Put the ASan runtime on PATH
        if: contains(matrix.cfg.mode, 'asan')
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC" `
                               -Filter clang_rt.asan_dynamic-x86_64.dll -Recurse -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $dll) { throw "clang_rt.asan_dynamic-x86_64.dll not found under VC\Tools\MSVC" }
          Write-Output "Found $($dll.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $dll.DirectoryName

      - name: Running Test with ${{ matrix.cfg.compiler }} in ${{ matrix.cfg.config }} - ${{ matrix.cfg.mode }} mode
        run: |
          cd test/example
          $local_path = "${{ github.workspace }}".Replace('\', '/')
          cmake -G "${{ matrix.cfg.compiler }}" -A x64 --preset=${{ matrix.cfg.mode }} -DCPM_COPACABANA_SOURCE="$local_path"
          cmake --build --preset=${{ matrix.cfg.mode }} --config ${{ matrix.cfg.config }} --target example-test --parallel 2
          ctest --preset=${{ matrix.cfg.mode }} -C ${{ matrix.cfg.config }} --output-on-failure
