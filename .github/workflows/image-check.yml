## The image action, run on a scaffolded project without pushing: a setup script, the install, and a finish script
## that copies a source into the home of the user and compiles it against the installed headers.
##======================================================================================================================
name: Image Check
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/image/**'
      - '.github/workflows/image-check.yml'

concurrency:
  group: copacabana-image-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Workflows / Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Scaffold a project with its two scripts
        shell: bash
        run: |
          python3 tools/new-project.py scaffold/mylib --name mylib --brief "A scaffolded library" \
                  --remote https://github.com/someone/mylib
          mkdir -p scaffold/mylib/docker
          printf 'set -e\necho ran > /etc/copa-setup-ran\n' > scaffold/mylib/docker/setup.sh
          printf 'set -e\ntest -f /etc/copa-setup-ran\nmkdir -p "$COPA_HOME/test"\ncp test/unit/version.cpp "$COPA_HOME/test/"\ng++ -std=c++20 test/unit/version.cpp -o /tmp/smoke\n/tmp/smoke\n' \
                 > scaffold/mylib/docker/finish.sh

      - name: Build the image without pushing it
        uses: ./.github/actions/image
        with:
          project: mylib
          directory: scaffold/mylib
          setup: docker/setup.sh
          finish: docker/finish.sh
          push: 'false'
