##======================================================================================================================
## The image action, run on a scaffolded project without pushing: a setup script, the install, and a finish script
## that writes into the sources, copies one into the home of the user, and compiles it against the installed headers.
## The layers the action adds are then read for what the mounts keep out of them.
##======================================================================================================================
name: Image Check
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/image/**'
      - '.github/workflows/image-check.yml'
      - 'test/image-layers.py'

concurrency:
  group: copacabana-image-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Workflows / Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Scaffold a project with its two scripts
        shell: bash
        run: |
          python3 tools/new-project.py scaffold/mylib --name mylib --brief "A scaffolded library" \
                  --remote https://github.com/someone/mylib
          git -C scaffold/mylib init --quiet
          mkdir -p scaffold/mylib/docker
          cat > scaffold/mylib/docker/setup.sh <<'EOF'
          set -e
          echo ran > /etc/copa-setup-ran
          EOF
          cat > scaffold/mylib/docker/finish.sh <<'EOF'
          set -e
          test -f /etc/copa-setup-ran
          touch .copa-finish-ran
          mkdir -p "$COPA_HOME/test"
          cp test/unit/version.cpp "$COPA_HOME/test/"
          g++ -std=c++20 test/unit/version.cpp -o /tmp/smoke
          /tmp/smoke
          EOF

      - name: Build the image without pushing it
        uses: ./.github/actions/image
        with:
          project: mylib
          directory: scaffold/mylib
          setup: docker/setup.sh
          finish: docker/finish.sh
          push: 'false'
          keep-on-runner: 'true'

      - name: Read the layers the action adds
        shell: bash
        run: |
          docker save "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mylib:${GITHUB_SHA:0:7}" -o "$RUNNER_TEMP/image.tar"
          python3 test/image-layers.py "$RUNNER_TEMP/image.tar" mylib
