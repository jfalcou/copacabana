## Doxygen generation and gh-pages deployment, shared by every project using copa_setup_doxygen.
##
##   jobs:
##     doc:
##       uses: jfalcou/copacabana/.github/workflows/documentation.yml@v1
##       with:
##         project: tts
##======================================================================================================================
name: Documentation
on:
  workflow_call:
    inputs:
      project:
        description: 'Project name, lowercased - drives the CMake options and the Doxygen target'
        type: string
        required: true
      image:
        description: 'Tag of ghcr.io/jfalcou/compilers to build in'
        type: string
        default: 'v10'
      coverage:
        description: 'Ship a coverage report alongside the documentation'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-doc:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:${{ inputs.image }}
    strategy:
      fail-fast: false
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v6

      - name: Prepare ${{ inputs.project }} for documentation
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          cmake -S . -B build -G Ninja "-D${PROJECT^^}_BUILD_TEST=OFF" "-D${PROJECT^^}_BUILD_DOCUMENTATION=ON"

      - name: Generate Doxygen
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: cmake --build build --target "${PROJECT}-doxygen"

      ##################################################################################################
      ## Coverage rides along with the documentation so both reach gh-pages in a single deployment,
      ## which is what keeps one from wiping the other out.
      ##################################################################################################
      - name: Generate Coverage Report
        if: inputs.coverage
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          cmake --preset gcc-coverage
          cmake --build build/gcc-coverage --config Debug --target "${PROJECT}-coverage-report"

      - name: Assemble Coverage into the Site
        if: inputs.coverage
        shell: bash
        run: |
          cp -r build/gcc-coverage/coverage build/doc/coverage

          python3 - build/gcc-coverage/coverage/summary.json build/doc/coverage/badge.json <<'EOF'
          import json, sys

          percent = json.load(open(sys.argv[1]))["line_percent"]

          # Shields paints whatever colour it is handed, so the thresholds belong here.
          for floor, colour in [(90, "brightgreen"), (75, "green"), (60, "yellow"), (40, "orange")]:
            if percent >= floor:
              break
          else:
            colour = "red"

          json.dump( { "schemaVersion": 1
                     , "label": "coverage"
                     , "message": f"{percent:.1f}%"
                     , "color": colour
                     }
                   , open(sys.argv[2], "w")
                   )
          EOF

          cat build/doc/coverage/badge.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/doc
