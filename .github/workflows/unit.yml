name: Unit Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linux:
    name: Linux
    uses: ./.github/workflows/matrix.yml
    with:
      file: .github/matrices/linux.yml

  macosx:
    name: MacOS
    uses: ./.github/workflows/matrix.yml
    with:
      file: .github/matrices/macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/matrix.yml
    with:
      file: .github/matrices/windows.yml

  ## gcc only: the image pairs clang 19 with llvm-cov 20, which reads no notes of another major.
  coverage:
    name: Coverage
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Collecting coverage
        working-directory: test/example
        run: |
          cmake --preset=dev-coverage -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
          cmake --build --preset=dev-coverage --target example-coverage-report --parallel 2

  ## clang only: -fproc-stat-report and -ftime-trace are clang flags.
  compile-cost:
    name: Compile Cost
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Measuring the compile cost, and breaking it down
        working-directory: test/example
        run: |
          cmake --preset=dev-compile-cost -DCMAKE_CXX_COMPILER=clang++ -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
          CMAKE_BUILD_PARALLEL_LEVEL=2 cmake --build --preset=dev-compile-cost --target example-compile-cost-report
          cmake --build --preset=dev-compile-cost --target example-time-trace --parallel 2
          python3 $GITHUB_WORKSPACE/test/compile-cost.py build/dev-compile-cost .

  ## The NDK ships its own toolchain file, which no preset here carries.
  android:
    name: Android NDK
    runs-on: [macos-14]
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Running CMake for Android NDK
        run: |
          mkdir build && cd build
          cmake ../test/example -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DCPM_COPACABANA_SOURCE=../

      - name: Compiling Unit Tests
        working-directory: build
        run: make example-test
