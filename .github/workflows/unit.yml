name: Unit Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linux:
    name: Linux
    uses: ./.github/workflows/matrix.yml
    with:
      file: .github/matrices/linux.yml

  macosx:
    name: MacOS
    uses: ./.github/workflows/matrix.yml
    with:
      file: .github/matrices/macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/matrix.yml
    with:
      file: .github/matrices/windows.yml

  ##====================================================================================================================
  ## The regression test for the defect this repository shipped from v7 to v7.1: the test step of matrix.yml was gated
  ## on an expression where a row saying nothing about test reads as null, which GitHub compares equal to false. Every
  ## row of every consumer then built without testing, and stayed green, a skipped step being green. Nothing inside a
  ## job can see that, so this reads the run back once the matrices are done.
  ##====================================================================================================================
  tested:
    name: Tests really ran
    needs: [linux, macosx, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Read this run back
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate                                                   \
             -q '.jobs[] | select([.steps[].name] | index("Run Unit Tests"))
                         | select([.steps[] | select(.name == "Run Unit Tests") | .conclusion] | index("skipped"))
                         | .name'                                                                                     \
             > skipped.txt

          if [ -s skipped.txt ]; then
            echo "These jobs never ran their tests:" >&2
            cat skipped.txt >&2
            exit 1
          fi

          echo "Every job of the platform matrices ran its tests."

  ## gcc only: the image pairs clang 19 with llvm-cov 20, which reads no notes of another major.
  coverage:
    name: Coverage
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Collecting coverage
        working-directory: test/example
        run: |
          cmake --preset=dev-coverage -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
          cmake --build --preset=dev-coverage --target example-coverage-report --parallel 2

  ## clang only: -fproc-stat-report and -ftime-trace are clang flags.
  compile-cost:
    name: Compile Cost
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Measuring the compile cost, and breaking it down
        working-directory: test/example
        run: |
          cmake --preset=dev-compile-cost -DCMAKE_CXX_COMPILER=clang++ -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
          CMAKE_BUILD_PARALLEL_LEVEL=2 cmake --build --preset=dev-compile-cost --target example-compile-cost-report
          cmake --build --preset=dev-compile-cost --target example-time-trace --parallel 2
          python3 $GITHUB_WORKSPACE/test/compile-cost.py build/dev-compile-cost .

  ## The NDK ships its own toolchain file, which no preset here carries.
  android:
    name: Android NDK
    runs-on: [macos-14]
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7

      - name: Running CMake for Android NDK
        run: |
          mkdir build && cd build
          cmake ../test/example -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DCPM_COPACABANA_SOURCE=../

      - name: Compiling Unit Tests
        working-directory: build
        run: make example-test
