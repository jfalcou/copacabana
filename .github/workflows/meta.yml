## A run of its own rather than a job inside the unit tests, so these land in their own box on a pull request instead
## of interleaving with the compiler matrices.
name: Meta Checks
on:
  pull_request:
    branches:
      - main

concurrency:
  group: copacabana-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:

  precommit:
    name: Meta Checks
    uses: ./.github/workflows/precommit.yml

  test-cpack:
    name: Build and Verify System Installers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup CMake
        uses: lukka/get-cmake@latest
      - name: Configure Project
        run: |
          cd test/example
          cmake -B build -S . -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
      - name: Build Project
        run: |
          cd test/example
          cmake --build build
      - name: Generate CPack Installers
        run: |
          cd test/example
          cmake --build build --target package
      - name: Verify DEB Package Validity
        run: |
          cd test/example
          # Find the generated .deb file
          DEB_FILE=$(ls build/*.deb | head -n 1)
          echo "Validating DEB Package: $DEB_FILE"

          echo "--- DEB Metadata ---"
          dpkg-deb -I "$DEB_FILE"

          echo "--- DEB File Contents ---"
          dpkg-deb -c "$DEB_FILE"

      - name: Verify RPM Package Validity
        run: |
          cd test/example
          # Find the generated .rpm file
          RPM_FILE=$(ls build/*.rpm | head -n 1)
          echo "Validating RPM Package: $RPM_FILE"

          echo "--- RPM Metadata ---"
          rpm -qpi "$RPM_FILE"

          echo "--- RPM Dependencies ---"
          rpm -qpR "$RPM_FILE"

          echo "--- RPM File Contents ---"
          rpm -qpl "$RPM_FILE"

  test-assets:
    name: Verify Documentation Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Run Asset Tests
        run: node --test test/*.test.js

  test-doxygen-setup:
    name: Verify the Shared Doxygen Setup
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Generate the example documentation
        run: |
          cmake -S test/example -B build/doc -G Ninja \
                -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE \
                -DEXAMPLE_BUILD_TEST=OFF -DEXAMPLE_BUILD_DOCUMENTATION=ON
          cmake --build build/doc --target example-doxygen

      - name: Check what it produced
        run: python3 test/doxygen-setup.py build/doc/doxygen-output

  test-install-layout:
    name: Verify Where the Package Installs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install the example three ways and look
        run: python3 test/install-layout.py $GITHUB_WORKSPACE

  test-two-consumers:
    name: Verify Two Consumers in One Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure Two Consumers
        run: cmake -S test/guard -B build/guard -DCOPACABANA_SOURCE_DIR=$GITHUB_WORKSPACE

  verify-hierarchy:
    name: Verify Ninja Target Hierarchy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure Project
        run: |
          cd test/example
          cmake -G Ninja -B build -S . \
                -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE \
                \
                -DOPT_QUIET=ON

      - name: Check Hierarchical Phony Targets
        run: |
          cd test/example/build
          # Dump the full list of Ninja targets
          ninja -t targets > all_targets.txt

          EXPECTED=(
            "unit.exe"
            "unit.types.exe"
            "unit.types.structure.exe"
            "unit.values.exe"
            "unit.values.value.exe"
            "unit.values.version.exe"
          )

          STATUS=0
          for target in "${EXPECTED[@]}"; do
            if grep -q "^$target:" all_targets.txt; then
              echo "✅ Found $target"
            else
              echo "❌ Missing $target"
              STATUS=1
            fi
          done

          exit $STATUS
