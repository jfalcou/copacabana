name: Meta Checks
on:
  pull_request:
    branches:
      - main

concurrency:
  group: copacabana-meta-${{ github.ref }}
  cancel-in-progress: true

jobs:

  precommit:
    name: Meta Checks
    uses: ./.github/workflows/precommit.yml

  ## Every check the repository runs, in one job: a row says what it is called and what it runs, and names what it
  ## needs to run it.
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.check.image && format('ghcr.io/jfalcou/compilers:{0}', matrix.check.image) || '' }}
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: "Docs / Assets"             , run: "node --test test/*.test.js" }
          - { name: "Docs / Warning Count"      , run: "python3 test/doxygen-warnings.py ." }
          - { name: "Docs / Shared Setup"       , run: "python3 test/doxygen-setup.py ."   , image: "v10" }
          - { name: "Scaffold / Project"        , run: "python3 test/scaffolder.py ."      , image: "v10" }
          - { name: "Scaffold / Hooks"          , run: "python3 test/scaffolded-hooks.py .", python: true }
          - { name: "Scaffold / Template Pins"  , run: "python3 test/template-pin.py ."    , tags: true }
          - { name: "Workflows / Matrix Outputs", run: "python3 test/matrix-outputs.py ."  , pyyaml: true }
          - { name: "CMake / Pre-commit Banner" , run: "python3 test/precommit-banner.py .", image: "v10" }
          - { name: "CMake / Ninja Target Hierarchy", run: "python3 test/target-hierarchy.py .", cmake: true }
          - { name: "CMake / Sources That Must Not Compile", run: "python3 test/failure-units.py .", image: "v10" }
          - { name: "CMake / Two Consumers in One Build", cmake: true,
              run: "cmake -S test/guard -B build/guard -DCOPACABANA_SOURCE_DIR=$PWD" }
          - { name: "Package / System Installers", run: "python3 test/system-installers.py .", cmake: true }
          - { name: "Package / Install Layout"   , run: "python3 test/install-layout.py ."  , cmake: true }
          - { name: "Package / Consumption"      , cmake: true, spack: true,
              run: "spack install copacabana &&
                    python3 test/package-consumption.py $(spack location -i copacabana)" }
    steps:
      - name: Checkout Code
        if: ${{ !matrix.check.tags }}
        uses: actions/checkout@v7

      ## The tags are what the template pins are checked against, so that row asks for the whole history.
      - name: Checkout Code and its tags
        if: matrix.check.tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup CMake and Ninja
        if: matrix.check.cmake
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      ## The container the builds use carries neither pip nor a venv, so a row needing pre-commit runs outside it,
      ## on the Python and the pinned release of the shared gate.
      - name: Set up Python
        if: matrix.check.python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pre-commit
        if: matrix.check.python
        run: pip install --only-binary ":all:" pre-commit==4.6.2

      - name: Install PyYAML
        if: matrix.check.pyyaml
        run: python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml

      ## The published tree is laid out by the recipe, not by copa_setup_install, so it is read where it is
      ## published. vcpkg and conan join with a row each once their ports land.
      - name: Set up Spack
        if: matrix.check.spack
        uses: spack/setup-spack@v3
        with:
          buildcache: true

      ## Evaluated rather than run as one word, a row being a shell command: globs, pipes and $(...) all work.
      - name: Check
        shell: bash
        env:
          COMMAND: ${{ matrix.check.run }}
        run: eval "$COMMAND"
