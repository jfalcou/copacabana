name: Copacabana - Linux Unit Tests
on:
  workflow_call:

jobs:

  linux:
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    strategy:
      fail-fast: false
      matrix:
        cfg:
        - { compiler: g++         , mode: dev-normal }
        - { compiler: g++         , mode: dev-tsan   }
        - { compiler: g++         , mode: dev-asan   }
        - { compiler: g++-14      , mode: dev-normal }
        - { compiler: g++-14      , mode: dev-tsan   }
        - { compiler: g++-14      , mode: dev-asan   }
        - { compiler: clang++     , mode: dev-normal }
        - { compiler: clang++     , mode: dev-asan   }
        - { compiler: clang++     , mode: dev-tsan   }
        - { compiler: clang++     , mode: dev-msan   , option: "-stdlib=libc++"}
        - { compiler: clang++-20  , mode: dev-normal }
        - { compiler: clang++-20  , mode: dev-asan   }
        - { compiler: clang++-20  , mode: dev-tsan   }
        - { compiler: clang++-20  , mode: dev-msan   , option: "-stdlib=libc++"}
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7
      - name: Running Test with ${{ matrix.cfg.compiler }} in ${{ matrix.cfg.mode }} mode
        run: |
          cd test/example
          cmake --preset=${{ matrix.cfg.mode }} -DCMAKE_CXX_COMPILER=${{ matrix.cfg.compiler }}         \
                -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE -DCMAKE_CXX_FLAGS="${{ matrix.cfg.option }}"
          cmake --build --preset=${{ matrix.cfg.mode }} --target example-test --parallel 2
          ctest --preset=${{ matrix.cfg.mode }} --output-on-failure

  # gcc only: the image pairs clang 19 with llvm-cov 20, and llvm-cov reads no notes written by
  # another major.
  coverage:
    name: Coverage
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7
      - name: Collecting coverage
        run: |
          cd test/example
          cmake --preset=dev-coverage -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
          cmake --build --preset=dev-coverage --target example-coverage-report --parallel 2

  # clang only: -fproc-stat-report and -ftime-trace are its flags, gcc has neither.
  compile-cost:
    name: Compile Cost
    runs-on: [ubuntu-latest]
    container:
      image: ghcr.io/jfalcou/compilers:v10
    steps:
      - name: Fetch current branch
        uses: actions/checkout@v7
      - name: Measuring the compile cost, and breaking it down
        run: |
          cd test/example
          cmake --preset=dev-compile-cost -DCMAKE_CXX_COMPILER=clang++ -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE
          CMAKE_BUILD_PARALLEL_LEVEL=2 cmake --build --preset=dev-compile-cost --target example-compile-cost-report
          cmake --build --preset=dev-compile-cost --target example-time-trace --parallel 2
          python3 $GITHUB_WORKSPACE/test/compile-cost.py build/dev-compile-cost .
