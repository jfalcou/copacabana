##======================================================================================================================
## Configure and build a CMake preset, shared by every project driving its CI from CMakePresets.json.
##
##   - uses: jfalcou/copacabana/.github/actions/config@<sha>
##     with:
##       preset: gcc
##       config: Release
##       targets: kumi-test    # omit to build the preset default target
##
##======================================================================================================================
name: 'Configure & Build'
description: 'Configure and build using CMake presets'

inputs:
  preset:
    description: 'Preset name (must exist in both configure and build presets)'
    required: true

  config:
    description: 'Build configuration'
    required: true
    default: ''

  wrapper:
    description: 'Compiler wrapper (e.g., emcmake)'
    default: ''

  setup-script:
    description: 'Path to environment setup script (e.g., oneAPI setvars.sh)'
    default: ''

  targets:
    description: 'Space-separated list of build targets. Empty builds the preset default target.'
    default: ''

  cmake-args:
    description: 'Extra configure arguments, e.g. -DCMAKE_CXX_COMPILER=g++-14. They override the preset.'
    default: ''

runs:
  using: "composite"
  steps:
    - name: Configure
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        WRAP: ${{ inputs.wrapper }}
        CONFIG: ${{ inputs.config }}
        SETUP_SCRIPT: ${{ inputs.setup-script }}
        TARGETS: ${{ inputs.targets }}
        CMAKE_ARGS: ${{ inputs.cmake-args }}
      run: |
        if [ -n "$SETUP_SCRIPT" ]; then
          if [ ! -f "$SETUP_SCRIPT" ]; then
            echo "Setup script not found: $SETUP_SCRIPT"
            exit 1
          fi
          source "$SETUP_SCRIPT"
        fi

        # Unquoted on purpose: the caller passes a whole argument list, not a single argument.
        if [ -n "$WRAP" ]; then
          "$WRAP" cmake --preset "$PRESET" $CMAKE_ARGS
        else
          cmake --preset "$PRESET" $CMAKE_ARGS
        fi

        args=(--build --preset "$PRESET" --config "$CONFIG")
        if [ -n "$TARGETS" ]; then
          args+=(--target $TARGETS)
        fi

        cmake "${args[@]}" --parallel 2
