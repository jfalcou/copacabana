## No image: the host clang is what this platform tests.
directory: test/example
runs-on: macos-latest
configs: [Debug]
build-targets: example-test
rows:
  - { name: "clang++"      , preset: "dev-normal", args: "-DCMAKE_CXX_COMPILER=clang++ -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
  - { name: "clang++ asan" , preset: "dev-asan"  , args: "-DCMAKE_CXX_COMPILER=clang++ -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
  - { name: "clang++ tsan" , preset: "dev-tsan"  , args: "-DCMAKE_CXX_COMPILER=clang++ -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
