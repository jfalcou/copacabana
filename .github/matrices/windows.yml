## Visual Studio builds both configurations from one configure, so the pair goes through configs.
directory: test/example
runs-on: windows-latest
configs: [Debug, Release]
build-targets: example-test
rows:
  - { name: "msvc"      , preset: "dev-normal", args: "-G \"Visual Studio 17 2022\" -A x64 -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
  - { name: "msvc asan" , preset: "dev-asan"  , args: "-G \"Visual Studio 17 2022\" -A x64 -DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
