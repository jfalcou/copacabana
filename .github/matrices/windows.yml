## Visual Studio builds both configurations from one configure, so the pair goes through configs.
directory: test/example
runs-on: windows-latest
configs: [Debug, Release]
build-targets: example-test
rows:
  - { name: "msvc"      , preset: "dev-normal", args: "-DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
  ## Built and not run: an ASan-instrumented executable never returned on this runner, thirteen minutes for what
  ## takes one under Linux ASan. Building it still checks that the flags hold together under MSVC.
  - { name: "msvc asan" , preset: "dev-asan"  , args: "-DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE", test: false }
