## Visual Studio builds both configurations from one configure, so the pair goes through configs. No
## generator is named: the presets carry none, so CMake takes the Visual Studio the runner ships.
directory: test/example
runs-on: windows-latest
configs: [Debug, Release]
build-targets: example-test
rows:
  - { name: "msvc"      , preset: "dev-normal", args: "-DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
  - { name: "msvc asan" , preset: "dev-asan"  , args: "-DCPM_COPACABANA_SOURCE=$GITHUB_WORKSPACE" }
